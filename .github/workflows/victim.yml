name: victim
on:
  workflow_dispatch:
permissions: {}
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - name: Restore privileged
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache-dir
          key: main-key-${{ github.run_id }}
          restore-keys: |
            pwn-
      - name: Check
        run: |
          echo "--- cache-dir:"; ls -la cache-dir 2>/dev/null || echo "(absent)"
          if [ -f cache-dir/marker.txt ]; then echo "RESULT=POISON_RESTORED content=$(cat cache-dir/marker.txt)"; else echo "RESULT=CLEAN_NO_MARKER"; fi
